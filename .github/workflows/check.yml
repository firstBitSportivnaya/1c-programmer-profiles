name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seed по контракту
        run: npm run check:seed
      - name: Паритет схемы
        run: npm run check:schema
      - name: Индексы чтений
        run: npm run check:indexes
      - name: Lint
        run: npm run lint
      - name: Типы
        run: npx tsc --noEmit
      - name: Сборка
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Системные пакеты для браузера
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      # Загрузка Chromium на раннере иногда висит без вывода: каждая попытка ограничена, третья — последняя.
      - name: Браузер для сценариев
        timeout-minutes: 12
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "Загрузка Chromium не удалась, попытка $attempt"
            sleep 10
          done
          exit 1
      - name: Сценарии в браузере
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  upgrade:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: head
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: base
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json
      - name: База версии ${{ github.base_ref }}
        working-directory: base
        run: |
          npm ci
          # Пока в базовой ветке нет скрипта заполнения, берётся скрипт из pull request.
          [ -f scripts/upgrade-base.ts ] || cp ../head/scripts/upgrade-base.ts scripts/
          DB_PATH="$RUNNER_TEMP/upgrade-base.sqlite" npm run db:seed
          DB_PATH="$RUNNER_TEMP/upgrade-base.sqlite" npx tsx scripts/upgrade-base.ts
      - name: Та же база кодом pull request
        working-directory: head
        run: |
          npm ci
          npm run check:upgrade -- "$RUNNER_TEMP/upgrade-base.sqlite"
